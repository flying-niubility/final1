<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>讲座活动 · 智慧校园</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" rel="stylesheet">
  <link href="css/style.css" rel="stylesheet">
</head>
<body>

  <!-- ========== 顶部导航 ========== -->
  <nav class="navbar navbar-expand-lg navbar-dark site-navbar sticky-top">
    <div class="container">
      <a class="navbar-brand text-white" href="index.html">
        <span class="brand-icon"><i class="fa-solid fa-graduation-cap"></i></span>
        智慧校园
      </a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#mainNav" aria-controls="mainNav" aria-expanded="false" aria-label="切换导航">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="mainNav">
        <ul class="navbar-nav ms-auto align-items-lg-center">
          <li class="nav-item"><a class="nav-link" href="index.html"><i class="fa-solid fa-house me-1"></i>首页</a></li>
          <li class="nav-item"><a class="nav-link" href="canteen.html"><i class="fa-solid fa-bowl-food me-1"></i>食堂美食</a></li>
          <li class="nav-item"><a class="nav-link" href="studyroom.html"><i class="fa-solid fa-book-open-reader me-1"></i>自习室</a></li>
          <li class="nav-item"><a class="nav-link" href="lecture.html"><i class="fa-solid fa-chalkboard-user me-1"></i>讲座活动</a></li>
        </ul>
      </div>
    </div>
  </nav>

  <!-- ========== 页面头 ========== -->
  <header class="page-hero">
    <div class="container">
      <h1><i class="fa-solid fa-chalkboard-user me-2"></i>讲座活动中心</h1>
      <p>学术科技、人文艺术、就业指导、创新创业，好讲座不错过</p>
    </div>
  </header>

  <main class="container my-4">
    <!-- ========== 查询工具栏 ========== -->
    <div class="card-soft toolbar-card mb-4">
      <div class="row g-2 align-items-end">
        <div class="col-md-7">
          <label class="form-label" for="searchLecture">讲座搜索</label>
          <div class="input-group">
            <span class="input-group-text bg-white"><i class="fa-solid fa-magnifying-glass text-muted"></i></span>
            <input type="search" class="form-control" id="searchLecture" placeholder="搜索讲座标题、主讲人或地点">
          </div>
        </div>
        <div class="col-md-5">
          <label class="form-label" for="filterCategory">讲座分类</label>
          <select class="form-select" id="filterCategory">
            <option value="">全部分类</option>
          </select>
        </div>
      </div>
    </div>

    <p class="result-count mb-3">共 <b id="lectureCount">0</b> 场讲座，你已报名 <b id="signedCount">0</b> 场</p>

    <!-- ========== 讲座列表 ========== -->
    <div class="row g-3" id="lectureGrid">
      <div class="col-12">
        <div class="loading-box">
          <div class="spinner-border spinner-c" role="status"></div>
          <p class="mt-2 mb-0">正在加载讲座数据...</p>
        </div>
      </div>
    </div>

    <!-- ========== 图表区 ========== -->
    <h2 class="section-title mt-5"><i class="fa-solid fa-chart-bar"></i>讲座报名数据</h2>
    <p class="section-subtitle">各场讲座报名率（报名人数 / 容量）</p>
    <div class="card-soft p-3">
      <div id="lectureRateChart" class="chart-box"></div>
    </div>
  </main>

  <!-- ========== 页脚 ========== -->
  <footer class="site-footer">
    <div class="container">
      <div class="row g-3">
        <div class="col-md-5">
          <h6>智慧校园公共服务信息中心</h6>
          <p class="mb-1">本项目为前端课程设计作品，展示校园食堂、自习室、讲座等公共服务信息与数据。</p>
        </div>
        <div class="col-6 col-md-3">
          <h6>快速链接</h6>
          <a href="canteen.html">食堂美食</a>
          <a href="studyroom.html">自习室</a>
          <a href="lecture.html">讲座活动</a>
        </div>
        <div class="col-6 col-md-4">
          <h6>技术支持</h6>
          <a href="javascript:void(0)">Bootstrap 5 + jQuery</a>
          <a href="javascript:void(0)">ECharts 数据可视化</a>
          <a href="javascript:void(0)">Three.js 三维展示</a>
        </div>
      </div>
      <div class="footer-bottom">© <span id="currentYear"></span> 智慧校园 Campus Hub · 课程设计作品 · 数据仅供演示</div>
    </div>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/jquery@3.7.1/dist/jquery.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/echarts@5.5.0/dist/echarts.min.js"></script>
  <script src="js/fallback-data.js"></script>
  <script src="js/common.js"></script>
  <script src="js/lecture.js"></script>
</body>
</html>
